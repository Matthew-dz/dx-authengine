[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act, max_days

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = r.sub.role == "admin" || (r.sub.role == p.sub && r.obj.name == p.obj && r.act == p.act && (p.max_days == "" || p.max_days == "999999" || float(r.obj.order_days_old) <= float(p.max_days)))
